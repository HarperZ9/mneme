[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme-memory"
version = "0.4.1"
description = "Accountable agent memory with layered retrieval, source provenance, re-derivable recall receipts, and drift checks. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-FSL-1.1-MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zain Dana Harper" }]
keywords = ["agent-memory", "llm-memory", "long-term-memory", "provenance", "retrieval", "bm25", "rag"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mneme = "mneme.cli:main"

[project.urls]
Homepage = "https://github.com/HarperZ9/mneme"

[tool.setuptools.packages.find]
where = ["src"]
