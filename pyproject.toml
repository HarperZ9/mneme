[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flywheel-mneme"
version = "0.7.0"
description = "Local memory for AI agents: each recalled fact names the turn it came from, and recall, drift checks and forgetting return receipts anyone can rerun."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Zain Dana Harper", email = "zaindharper@gmail.com" }]
keywords = ["agent-memory", "llm-memory", "long-term-memory", "provenance", "retrieval", "bm25", "rag"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mneme = "mneme.cli:main"

[project.urls]
Homepage = "https://github.com/HarperZ9/mneme"

[tool.setuptools.packages.find]
where = ["src"]
