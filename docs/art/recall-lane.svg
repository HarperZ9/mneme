<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of a verifiable recall: turn, atom, scenario, persona, query, score, fuse, receipt. Raw dialogue is stored verbatim as a turn and never summarized away. An atom is one fact bound to the turn it came from, a scenario groups related atoms, and a persona cites its atoms instead of prose. A query records its own scope. Keyword scoring is pure Python BM25 and always available; reciprocal rank fusion folds in a vector channel when an embedder is supplied. The receipt carries the ranked hits, both score channels, the scorer-definition hash, and the fusion rule. Verification re-runs the same scorer over the same rows and compares. Two outcomes: reproduced, and did not reproduce."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE QUESTION, ANSWERED FROM THE RECORD</text><text class="h" x="44" y="72">How a recall becomes a ranking someone else can re-derive</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 398V420H367.75V405"/><text class="k" x="592.25" y="437" text-anchor="middle" fill="var(--drift)">VERIFY RE-RUNS THE SCORER OVER THE SAME ROWS</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Turn</text><text class="s" x="58" y="168">Raw dialogue, stored whole and</text><text class="s" x="58" y="183">never summarized.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Atom</text><text class="s" x="282.5" y="168">One fact, bound to the turn it</text><text class="s" x="282.5" y="183">was taken from.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Scenario</text><text class="s" x="507" y="168">Related atoms, grouped into</text><text class="s" x="507" y="183">one scene.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Persona</text><text class="s" x="731.5" y="168">A profile that cites atoms,</text><text class="s" x="731.5" y="183">not prose.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Query</text><text class="s" x="58" y="360">One question, with its scope</text><text class="s" x="58" y="375">recorded.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Score</text><text class="s" x="282.5" y="360">BM25 in pure Python, with no</text><text class="s" x="282.5" y="375">dependency.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Fuse</text><text class="s" x="507" y="360">Rank fusion folds in the</text><text class="s" x="507" y="375">vector channel.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Receipt</text><text class="s" x="731.5" y="360">The hits, both scores, and the</text><text class="s" x="731.5" y="375">fusion rule.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H255.5V472"/><rect x="44" y="472" width="423" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">REPRODUCED</text><text class="s" x="58" y="509" font-size="10.5">the same rows re-derive the same ranking</text><path class="thin" d="M816.75 448H704.5V472"/><rect x="493" y="472" width="423" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="507" y="493" font-size="13">DID NOT REPRODUCE</text><text class="s" x="507" y="509" font-size="10.5">a tampered ranking, or a store that moved</text><text class="s" x="44" y="546">The ranking is re-derived from the rows, never read back from the receipt.</text></svg>
